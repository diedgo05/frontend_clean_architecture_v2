<div class="page-content page-container" id="page-content">
  <div class="padding">
    <div class="row container d-flex justify-content-center">
      <div class="col-lg-8 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">Lista de Buses</h4>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Placa</th>
                    <th>ID Chofer</th>
                    <th>Capacidad</th>
                    <th>Disponible</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let bus of buses">
                    <td>{{ bus.Placa }}</td>
                    <td>{{ bus.ChoferID }}</td>
                    <td>{{ bus.Capacidad }}</td>
                    <td>
                      <label
                        class="badge"
                        [ngClass]="{
                          'badge-success': bus.Disponible,
                          'badge-danger': !bus.Disponible
                        }"
                      >
                        {{ bus.Disponible}}
                      </label>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
